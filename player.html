<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playing {{ filename }} - Smart Video Player</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-white">

<nav class="navbar navbar-dark bg-danger px-4">
  <span class="navbar-brand mb-0 h1">FACEFLIX</span>
  <a href="{{ url_for('upload') }}" class="btn btn-outline-light btn-sm">&larr; Back to videos</a>
</nav>

<div class="container mt-4">
  <h5 class="mb-3">{{ filename }}</h5>

  <div id="statusBanner" class="alert alert-secondary py-2">Starting camera monitor...</div>

  <video id="mainVideo" class="w-100" controls style="max-height:70vh; background:#000;">
    <source src="{{ url_for('static', filename='uploads/' + filename) }}">
    Your browser does not support the video tag.
  </video>

  <div class="mt-3">
    <p class="text-muted mb-1">Monitor preview (used to detect eyes closed / looking away):</p>
    <img src="{{ url_for('video_feed') }}" width="240" class="border border-secondary rounded">
  </div>
</div>

<script>
const video = document.getElementById('mainVideo');
const banner = document.getElementById('statusBanner');

async function pollStatus() {
  try {
    const res = await fetch('/status');
    const data = await res.json();

    if (data.pause) {
      if (!video.paused) video.pause();
      banner.className = 'alert alert-warning py-2';
      banner.textContent = 'Paused: ' + data.reason;
    } else {
      if (video.paused && video.currentTime > 0 && !video.ended) {
        video.play().catch(() => {});
      }
      banner.className = 'alert alert-success py-2';
      banner.textContent = data.reason;
    }
  } catch (e) {
    banner.className = 'alert alert-danger py-2';
    banner.textContent = 'Monitor connection lost';
  }
}

setInterval(pollStatus, 500);

// stop camera monitor when leaving the page
window.addEventListener('beforeunload', () => {
  navigator.sendBeacon('/stop_monitor');
});
</script>

</body>
</html>
